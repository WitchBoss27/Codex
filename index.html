<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunset Letters</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <section class="screen landing active" id="landingScreen" aria-label="Landing screen">
        <div class="landing-card pixel-frame">
          <h1>Sunset Letters</h1>
          <p>A tiny pixel-art walk through a warm savanna.</p>
          <button id="playButton" class="primary-btn" type="button">Play</button>
        </div>
      </section>

      <section class="screen game" id="gameScreen" aria-label="Game screen">
        <div class="sky-glow"></div>
        <div class="sun"></div>
        <div class="hills hill-back"></div>
        <div class="hills hill-front"></div>

        <div class="savanna" id="savanna" aria-hidden="true">
          <div class="tree-line" id="treeLine"></div>
          <div class="giraffe" id="giraffe" aria-hidden="true">
            <div class="giraffe-shadow"></div>
            <div class="leg leg-back"></div>
            <div class="leg leg-front"></div>
            <div class="body"></div>
            <div class="neck"></div>
            <div class="head">
              <span class="ear ear-left"></span>
              <span class="ear ear-right"></span>
              <span class="ossicone oss-left"></span>
              <span class="ossicone oss-right"></span>
              <span class="eye"></span>
              <span class="snout"></span>
            </div>
            <span class="tail"></span>
            <div class="spots" aria-hidden="true"></div>
          </div>
        </div>

        <div class="hud">
          <p class="progress" id="progressText">Letter 0 / 14</p>
        </div>
      </section>

      <section class="screen ending" id="endingScreen" aria-label="Ending screen">
        <div class="ending-card pixel-frame">
          <h2>Every letter delivered.</h2>
          <p>The sun dipped, the savanna listened, and the giraffe stayed.</p>
          <button id="restartButton" class="primary-btn" type="button">Play Again</button>
        </div>
      </section>
    </main>

    <div class="letter-modal" id="letterModal" aria-hidden="true" role="dialog" aria-labelledby="letterTitle">
      <div class="letter-shell" id="letterShell">
        <button class="close-modal" id="closeModalButton" type="button" aria-label="Close letter">×</button>

        <div class="envelope-state" id="envelopeState">
          <h3 id="letterTitle">A Letter Awaits</h3>
          <p>Tap to open</p>
          <button class="open-letter-btn" id="openLetterButton" type="button">Open Envelope</button>
        </div>

        <article class="letter-state" id="letterState" hidden>
          <p id="letterMessage"></p>
          <button class="next-btn" id="continueButton" type="button">Continue</button>
        </article>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
