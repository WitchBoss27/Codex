<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Italy Trip Landing Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="welcome-screen" class="screen screen-active" aria-label="Welcome screen">
        <div class="collage-overlay"></div>
        <div class="welcome-card" role="dialog" aria-labelledby="welcome-title">
          <p class="pixel-chip">Italy adventure</p>
          <h1 id="welcome-title">Welcome to your trip</h1>
          <p class="welcome-subtitle">Please enter your name</p>

          <form id="name-form" class="name-form" autocomplete="off">
            <label class="sr-only" for="traveler-name">Your name</label>
            <input id="traveler-name" name="travelerName" type="text" maxlength="24" placeholder="e.g., Sofia" required />
            <button type="submit">Enter</button>
          </form>
        </div>
      </section>

      <section id="map-screen" class="screen" aria-label="Italy map screen">
        <header class="trip-header">
          <h2 id="greeting">Hi, traveler</h2>
          <p id="countdown">0 days until Italy 🇮🇹</p>
        </header>

        <div class="map-wrap">
          <svg class="italy-map" viewBox="0 0 320 620" role="img" aria-label="Illustrated map of Italy with highlighted cities">
            <defs>
              <linearGradient id="landGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ffd37e" />
                <stop offset="50%" stop-color="#ffb36c" />
                <stop offset="100%" stop-color="#f9836b" />
              </linearGradient>
              <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#c45a5f" flood-opacity="0.25" />
              </filter>
            </defs>

            <path
              class="italy-shape"
              filter="url(#softShadow)"
              d="M108 30
                 C120 28 133 34 145 47
                 C158 61 165 75 181 88
                 C196 101 215 110 222 126
                 C229 142 226 159 212 174
                 C197 189 180 204 175 223
                 C170 241 176 260 194 276
                 C211 292 220 309 221 327
                 C222 347 214 363 196 374
                 C181 383 176 397 186 411
                 C196 425 208 441 210 456
                 C212 472 199 482 180 485
                 C166 487 157 493 154 506
                 C150 520 141 534 122 540
                 C101 547 85 537 78 521
                 C71 506 66 489 55 476
                 C43 463 38 446 45 431
                 C53 414 66 404 83 398
                 C99 392 104 384 99 368
                 C93 351 82 337 75 320
                 C67 301 67 282 79 265
                 C91 248 106 236 111 220
                 C116 205 108 190 95 177
                 C82 163 72 147 76 129
                 C81 109 96 93 104 77
                 C112 61 110 44 108 30 Z"
            />

            <ellipse class="sicily" cx="78" cy="571" rx="36" ry="18" />
            <ellipse class="sardinia" cx="36" cy="486" rx="18" ry="34" />
          </svg>

          <button class="location rome" data-label="Rome" style="--x: 172px; --y: 283px" aria-label="Rome"></button>
          <button class="location florence" data-label="Florence" style="--x: 165px; --y: 238px" aria-label="Florence"></button>
          <button class="location venice" data-label="Venice" style="--x: 198px; --y: 196px" aria-label="Venice"></button>
          <button class="location amalfi" data-label="Amalfi Coast" style="--x: 172px; --y: 333px" aria-label="Amalfi Coast"></button>
          <button class="location naples" data-label="Naples" style="--x: 157px; --y: 317px" aria-label="Naples"></button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
